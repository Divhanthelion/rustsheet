[package]
name = "rustsheet"
version = "1.0.0"
edition = "2024"
rust-version = "1.87"
description = "A fast, native spreadsheet with an Excel-compatible formula engine"
repository = "https://github.com/Divhanthelion/rustsheet"
license = "MIT"

[features]
default = ["xlsx", "gui", "csv"]
xlsx = ["dep:calamine", "dep:rust_xlsxwriter", "dep:zip", "dep:serde_json", "dep:quick-xml"]
csv = ["dep:csv"]
gui = ["dep:eframe", "dep:egui_extras", "dep:egui_plot", "dep:image", "dep:rfd", "dep:arboard", "dep:serde_json", "dep:ttf-parser", "dep:flate2", "dep:epaint_default_fonts", "dep:windows-sys"]
web = ["dep:eframe", "dep:egui_extras", "dep:egui_plot", "dep:image", "dep:wasm-bindgen", "dep:console_error_panic_hook", "dep:web-sys", "dep:wasm-bindgen-futures", "dep:getrandom"]
gpu = ["dep:wgpu", "dep:glyphon", "dep:cosmic-text", "dep:bytemuck", "dep:raw-window-handle"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:console_error_panic_hook", "wgpu?/webgpu", "wgpu?/webgl"]

[dependencies]
# Core data structures
hashbrown = "0.15"
roaring = "0.10"
lasso = { version = "0.7", features = ["multi-threaded", "ahasher"] }

# Incremental computation
salsa = "0.25"

# Formula parsing
pest = "2.8"
pest_derive = "2.8"

# Excel I/O (optional)
calamine = { version = "0.32", optional = true }
rust_xlsxwriter = { version = "0.92", optional = true }
quick-xml = { version = "0.38", optional = true }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CSV I/O (optional)
csv = { version = "1.3", optional = true }
serde_json = { version = "1.0", optional = true }
zip = { version = "4.6", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Async runtime (for async formulas)
tokio = { version = "1.0", features = ["rt-multi-thread", "sync"], optional = true }

# GUI (optional)
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit"], optional = true }
egui_extras = { version = "0.31", features = ["all_loaders"], optional = true }
egui_plot = { version = "0.31", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
rfd = { version = "0.15", optional = true }
# Clipboard reads for Edit > Paste (egui-winit already links it for Ctrl+V)
arboard = { version = "3.6", optional = true, default-features = false }
# PDF export: the UI font's metrics, and compressed streams
ttf-parser = { version = "0.25", optional = true }
flate2 = { version = "1", optional = true }
epaint_default_fonts = { version = "0.31", optional = true }

# Web-specific
web-sys = { version = "0.3", optional = true, features = ["console", "Window", "Document", "Element", "HtmlCanvasElement"] }
wasm-bindgen-futures = { version = "0.4", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

# GPU rendering (optional)
wgpu = { version = "28.0", optional = true }
glyphon = { version = "0.10", optional = true }
cosmic-text = { version = "0.14", optional = true }
bytemuck = { version = "1.21", features = ["derive"], optional = true }
raw-window-handle = { version = "0.6", optional = true }

# WASM support (optional)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# Printing (GDI and the standard Print dialog)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs", "Win32_Storage_Xps"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
criterion = "0.5"
proptest = "1.6"

# [[bench]]
# name = "grid_benchmark"
# harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
inherits = "release"
debug = true

# See vendor/webbrowser/Cargo.toml: keeps process-launch APIs out of the exe.
[patch.crates-io]
webbrowser = { path = "vendor/webbrowser" }
