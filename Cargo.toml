[package]
name = "rustsheet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "High-performance spreadsheet engine in Rust"
license = "MIT OR Apache-2.0"

[features]
default = ["xlsx", "gui"]
xlsx = ["dep:calamine", "dep:rust_xlsxwriter"]
gui = ["dep:eframe", "dep:egui_extras", "dep:image", "dep:rfd"]
gpu = ["dep:wgpu", "dep:glyphon", "dep:cosmic-text", "dep:bytemuck", "dep:raw-window-handle"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:console_error_panic_hook", "wgpu?/webgpu", "wgpu?/webgl"]

[dependencies]
# Core data structures
hashbrown = "0.15"
roaring = "0.10"
lasso = { version = "0.7", features = ["multi-threaded", "ahasher"] }

# Incremental computation
salsa = "0.25"

# Formula parsing
pest = "2.8"
pest_derive = "2.8"

# Excel I/O (optional)
calamine = { version = "0.32", optional = true }
rust_xlsxwriter = { version = "0.92", optional = true }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Async runtime (for async formulas)
tokio = { version = "1.0", features = ["rt-multi-thread", "sync"], optional = true }

# GUI (optional)
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"], optional = true }
egui_extras = { version = "0.31", features = ["all_loaders"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
rfd = { version = "0.15", optional = true }

# GPU rendering (optional)
wgpu = { version = "28.0", optional = true }
glyphon = { version = "0.10", optional = true }
cosmic-text = { version = "0.14", optional = true }
bytemuck = { version = "1.21", features = ["derive"], optional = true }
raw-window-handle = { version = "0.6", optional = true }

# WASM support (optional)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.6"

[[bench]]
name = "grid_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
inherits = "release"
debug = true
