name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  msix:
    name: Windows MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --release
      - name: Build MSIX
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          # Without the Partner Center identity this is a local-test package only.
          $identity = @{}
          if ($env:IDENTITY_NAME) { $identity.IdentityName = $env:IDENTITY_NAME }
          if ($env:PUBLISHER) { $identity.Publisher = $env:PUBLISHER }
          if ($env:PUBLISHER_DISPLAY_NAME) { $identity.PublisherDisplayName = $env:PUBLISHER_DISPLAY_NAME }
          .\packaging\windows\build-msix.ps1 @identity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msix
          path: target/msix/*.msix
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem target/msix/*.msix).FullName --title "RustSheet ${{ github.ref_name }}" --generate-notes
