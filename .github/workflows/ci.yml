name: CI
on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Engine tests run on Linux without GUI dependencies
  engine-tests:
    name: Engine Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Check (xlsx + csv features)
        run: cargo check --no-default-features --features "xlsx,csv"
      - name: Run engine tests
        run: cargo test --no-default-features --features "xlsx,csv"
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy lints
        run: cargo clippy --no-default-features --features "xlsx,csv" -- -D warnings

  # GUI check on Linux (requires system libs, may fail on headless CI)
  gui-check:
    name: GUI Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev libatk1.0-dev libpango1.0-dev
      - name: Check with GUI features
        run: cargo check --features "gui,xlsx,csv"
